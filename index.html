<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>Character Archive — Legio XII Fulminata</title>
  <link rel="stylesheet" href="styles.css?v=5.2">
</head>
<body data-theme="standard">
  <main class="shell">
    <header class="topbar compact-topbar">
      <div class="brand-lockup">
        <span class="brand-icon legion-brand-icon" aria-hidden="true"><img src="legio-mark-clean.png" alt="Símbolo da Legião XII"><span class="brand-fallback" hidden>XII</span></span>
        <div class="brand-copy">
          <p class="eyebrow">LEGIO XII FULMINATA</p>
          <h1>Character Archive</h1>
        </div>
      </div>
      <div class="actions compact-actions">
        <div id="coreStatus" class="core-status loading" title="Sincronizando regras"><i></i><span>CORE…</span></div>
        <button id="exportBtn" class="ghost small-btn" type="button">Exportar JSON</button>
        <label class="ghost file-btn small-btn">Importar JSON<input id="importInput" type="file" accept="application/json"></label>
        <button id="resetBtn" class="danger small-btn" type="button">Resetar</button>
      </div>
    </header>

    <section id="creationView" class="grid two"></section>
    <section id="sheetView" class="hidden"></section>

    <footer>
      <p>SCUTUM · Ficha Universal da Legio XII Fulminata · tema padrão.</p>
    </footer>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="skills.js?v=5.2"></script>
  <script src="gods.js?v=5.2"></script>
  <script src="abilities.js?v=5.2"></script>
  <script src="abilities-extra.js?v=5.2"></script>
  <script src="system.js?v=5.2"></script>
  <script src="talents.js?v=5.2"></script>
  <script src="magic.js?v=5.2"></script>
  <script src="roma.js?v=5.2"></script>
  <script src="familiars.js?v=5.2"></script>
  <script src="core-bridge.js?v=5.2"></script>
  <script src="bootstrap.js?v=5.2"></script>
</body>
</html>
