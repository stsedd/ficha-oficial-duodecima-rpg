name: Patch Version and Image Storage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-version-image-storage.yml'
      - 'scripts/tmp-patch-version-image-storage.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python scripts/tmp-patch-version-image-storage.py

      - name: Syntax and contract checks
        run: |
          node --check app-v511.js
          node --check bootstrap-v511.js
          node --check stabilization-v516.js
          grep -q 'v5.15.7-image-storage' VERSION.txt
          grep -q 'v5.15.7-image-storage' index.html
          grep -q 'compactStoredEquipmentImages' app-v511.js
          grep -q 'targetLength=150000' app-v511.js
          ! grep -q "const DISPLAY_VERSION='v5.15.3-magic-sacrifice'" stabilization-v516.js
          grep -q "'VERSION.txt'" .github/workflows/sync-index-version.yml

      - name: Commit fix
        run: |
          git config user.name 'duodecima-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add VERSION.txt index.html app-v511.js bootstrap-v511.js stabilization-v516.js RUNTIME-MANIFEST.md .github/workflows/sync-index-version.yml
          git commit -m 'Fix version drift and equipment image storage'
          git push
