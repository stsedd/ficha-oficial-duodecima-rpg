name: Sync Core snapshot

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-core-snapshot.mjs'
      - '.github/workflows/sync-core-snapshot.yml'
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate snapshot
        run: node scripts/sync-core-snapshot.mjs

      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- core-snapshot.json && git ls-files --error-unmatch core-snapshot.json >/dev/null 2>&1; then
            echo 'Snapshot já está atualizado.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core-snapshot.json
          git commit -m 'chore: sync Duodécima Core snapshot'
          git push
