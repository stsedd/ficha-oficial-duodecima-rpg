name: Diagnose lineage patch anchors
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-lineage-semantics.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record patch anchor counts
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app-v511.js').read_text()
          patterns={
            'defaultLineage':"const defaultLineage = () => ({type:'normal',secondaryGodId:'',structureGodId:'',compoundPassiveReplacements:[],compoundActiveReplacements:[],compoundActiveSlots:[],directPrimaryPassives:[],directSecondaryPassives:[]});",
            'migrate':"out.lineage=Object.assign(defaultLineage(),data?.lineage||{});\n    out.lineage.compoundPassiveReplacements",
            'reset':"function resetLineage(type='normal'){state.lineage=defaultLineage();state.lineage.type=type;if(type!=='normal'&&eligibleLegacyGods()[0])state.lineage.secondaryGodId=eligibleLegacyGods()[0].id;if(type==='direct'){state.lineage.structureGodId=state.godId;initializeDirectSelections()}}",
            'effectiveDirectOld':"    if(type==='compound'){\n      const passives=main.passives.map",
            'effectiveCompoundOld':"    if(type==='direct'){\n      const pa=new Set(state.lineage.directPrimaryPassives",
            'validationDirectOld':"if(l.type==='compound'){\n      if((l.compoundPassiveReplacements||[]).length>3)add('error','Legado Composto excedeu 3 trocas de passivas.');\n      if((l.compoundActiveReplacements||[]).length>2)add('error','Legado Composto excedeu 2 trocas de ativas.');",
            'validationCompoundOld':"if(l.type==='direct'){\n      if((l.directPrimaryPassives||[]).length!==4)add('warn','Legado Direto deve selecionar 4 passivas da primeira origem.');\n      if((l.directSecondaryPassives||[]).length!==3)add('warn','Legado Direto deve selecionar 3 passivas da segunda origem.');",
            'selectLabels':"<option value=\"compound\" ${type==='compound'?'selected':''}>DEUS + LEGADO · Legado Composto</option><option value=\"direct\" ${type==='direct'?'selected':''}>LEGADO + LEGADO · Legado Direto</option>",
            'renderDirectOld':"    if(type==='compound'){\n      const reps=state.lineage.compoundPassiveReplacements",
            'directLabel':'<b>DEUS + LEGADO · Legado Composto.</b> É filho direto de um deus, mas também carrega uma herança divina secundária.',
            'compoundLabel':'<b>LEGADO + LEGADO · Legado Direto.</b> É filho de semideuses e carrega duas heranças divinas próximas.',
            'compoundNote':'<div class="notice"><b>Estrutura do Legado Direto:</b> HP, progressão de HP, conjuração, bônus de atributos, perícia divina e recursos usam sempre <b>${main.name}</b>, o deus principal. A segunda origem participa apenas da composição prevista das habilidades.</div>',
            'creationSecondary':"if(state.lineage.type==='direct'){state.lineage.structureGodId=state.godId;initializeDirectSelections()}state.divineSkillChoice='';",
            'sheetSecondary':"if(state.lineage.type==='direct')initializeDirectSelections();save();renderSheet()"
          }
          lines=[f'{k}={s.count(v)}' for k,v in patterns.items()]
          lp=Path('lineage-creation-v515.js').read_text()
          lines.append('pluginNormalizeAnchor='+str(lp.count("  function normalizeDirectState(data){\n")))
          lines.append('pluginPrebootAnchor='+str(lp.count("    let changed=normalizeDirectState(data);\n    if(data.lineage?.type==='compound'&&data.divineSkillChoice){data.divineSkillChoice='';changed=true}")))
          lines.append('bootstrapVersion='+str(Path('bootstrap-v511.js').read_text().count('v5.15.9-lineage-structure')))
          lines.append('indexVersion='+str(Path('index.html').read_text().count('v5.15.9-lineage-structure')))
          Path('LINEAGE_PATCH_DIAG.txt').write_text('\n'.join(lines)+'\n')
          PY
      - name: Commit diagnostics
        run: |
          git config user.name 'Legio Fulminata'
          git config user.email '131549072+stsedd@users.noreply.github.com'
          git add LINEAGE_PATCH_DIAG.txt
          git commit -m 'Diagnose lineage patch anchors'
          git push