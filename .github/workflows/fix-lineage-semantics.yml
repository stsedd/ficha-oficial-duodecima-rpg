name: Polish lineage creation semantics
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-lineage-semantics.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix remaining creation copy and fallbacks
        run: |
          python - <<'PY'
          from pathlib import Path
          def one(text,old,new,label):
              n=text.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1, found {n}')
              return text.replace(old,new,1)
          p=Path('app-v511.js'); s=p.read_text()
          s=one(s,
            "<div class=\"subcard lineage-definition ${type==='compound'?'selected':''}\"><span class=\"label\">${esc(compoundRule.formula||'DEUS + LEGADO')}</span><b>${esc(compoundRule.label||'Legado Composto')}</b><p>${esc(compoundRule.description||'É filho direto de um deus, mas também carrega uma herança divina secundária.')}</p></div>",
            "<div class=\"subcard lineage-definition ${type==='compound'?'selected':''}\"><span class=\"label\">${esc(compoundRule.formula||'LEGADO + LEGADO')}</span><b>${esc(compoundRule.label||'Legado Composto')}</b><p>${esc(compoundRule.description||'É filho de semideuses e carrega duas heranças divinas próximas.')}</p></div>",
            'compound definition')
          s=one(s,
            "<div class=\"subcard lineage-definition ${type==='direct'?'selected':''}\"><span class=\"label\">${esc(directRule.formula||'LEGADO + LEGADO')}</span><b>${esc(directRule.label||'Legado Direto')}</b><p>${esc(directRule.description||'É filho de semideuses e carrega duas heranças divinas próximas.')}</p></div>",
            "<div class=\"subcard lineage-definition ${type==='direct'?'selected':''}\"><span class=\"label\">${esc(directRule.formula||'DEUS + LEGADO')}</span><b>${esc(directRule.label||'Legado Direto')}</b><p>${esc(directRule.description||'É filho direto de um deus, mas também carrega uma herança divina secundária.')}</p></div>",
            'direct definition')
          s=one(s,
            "${type==='compound'?`<div class=\"notice\"><b>DEUS + LEGADO · Legado Composto:</b> ${esc(compoundRule.description||'É filho direto de um deus, mas também carrega uma herança divina secundária.')} Depois da criação, a seção <b>Configuração de Legado</b> na Visão Geral permite trocar até 3 passivas e até 2 das primeiras 5 ativas pelas da segunda origem.</div>`:''}",
            "${type==='direct'?`<div class=\"notice\"><b>DEUS + LEGADO · Legado Direto:</b> ${esc(directRule.description||'É filho direto de um deus, mas também carrega uma herança divina secundária.')} Mantém o kit do deus principal e, na <b>Configuração de Legado</b>, pode substituir até 3 passivas e até 2 das cinco primeiras ativas pelas da segunda origem. HP inicial, atributos e perícia inicial seguem o deus principal.</div>`:''}",
            'direct creation notice')
          s=one(s,
            "${type==='direct'&&sub?`<div class=\"notice\"><b>LEGADO + LEGADO · Legado Direto:</b> ${esc(directRule.description||'É filho de semideuses e carrega duas heranças divinas próximas.')} A ficha usa 4 passivas de uma origem + 3 da outra e as cinco primeiras ativas dos dois kits; nenhuma habilidade 6+ entra. <b>HP, progressão de HP, conjuração, bônus de atributos, perícia divina e recursos estruturais vêm sempre do deus principal (${esc(primaryGod().name)}).</b></div>`:''}",
            "${type==='compound'&&sub?`<div class=\"notice\"><b>LEGADO + LEGADO · Legado Composto:</b> ${esc(compoundRule.description||'É filho de semideuses e carrega duas heranças divinas próximas.')} A ficha usa 4 passivas de uma origem + 3 da outra e as cinco primeiras ativas dos dois kits; nenhuma habilidade 6+ entra. Para a criação, usa o menor HP inicial entre as duas origens e permite escolher um bônus de +2, um de +1 e uma perícia inicial entre ambas.</div>`:''}",
            'compound creation notice')
          p.write_text(s)

          old='v5.15.10-lineage-semantics'; new='v5.15.11-lineage-semantics'
          for name in ['bootstrap-v511.js','index.html']:
              q=Path(name); text=q.read_text()
              if old not in text: raise SystemExit(f'{name}: version marker missing')
              q.write_text(text.replace(old,new))
          p=Path('RUNTIME-MANIFEST.md'); text=p.read_text()
          text=text.replace('`v5.15.10-lineage-semantics`','`v5.15.11-lineage-semantics`')
          p.write_text(text)
          PY
      - name: Validate runtime
        run: |
          node --check app-v511.js
          node --check bootstrap-v511.js
          grep -F "compoundRule.formula||'LEGADO + LEGADO'" app-v511.js
          grep -F "directRule.formula||'DEUS + LEGADO'" app-v511.js
          grep -F "DEUS + LEGADO · Legado Direto:" app-v511.js
          grep -F "LEGADO + LEGADO · Legado Composto:" app-v511.js
          grep -F "v5.15.11-lineage-semantics" index.html bootstrap-v511.js RUNTIME-MANIFEST.md
          git diff --check
      - name: Commit final ficha correction
        run: |
          git config user.name 'Legio Fulminata'
          git config user.email '131549072+stsedd@users.noreply.github.com'
          git add app-v511.js bootstrap-v511.js index.html RUNTIME-MANIFEST.md
          git commit -m 'Align lineage creation copy with canonical rules'
          git push