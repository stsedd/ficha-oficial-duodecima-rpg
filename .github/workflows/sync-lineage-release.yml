name: Sync Lineage Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-lineage-release.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync visible version
        run: node scripts/patch-index-version.mjs
      - name: Validate lineage release
        run: |
          node --check bootstrap-v511.js
          node scripts/validate-lineage-structure.mjs
          grep -q 'v5.15.9-lineage-structure' index.html
      - name: Commit synced index
        run: |
          git config user.name 'duodecima-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Sync lineage fix release version'
          git push
