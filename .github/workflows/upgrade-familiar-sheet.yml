name: Upgrade familiar sheet
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/upgrade-familiar-sheet.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply familiar mini-sheet integration
        run: python scripts/patch-familiar-sheet.py
      - name: Validate runtime
        run: |
          node --check app-v511.js
          node --check bootstrap-v511.js
          grep -F "v5.15.12-familiar-sheet" index.html bootstrap-v511.js RUNTIME-MANIFEST.md
          grep -F "familiar-sheet-head" app-v511.js styles-v511.css
          grep -F "data-familiar-barding-field" app-v511.js
          grep -F "data-familiar-ability-field" app-v511.js
          grep -F "data-familiar-image" app-v511.js
          git diff --check
      - name: Commit integration
        run: |
          git config user.name 'Legio Fulminata'
          git config user.email '131549072+stsedd@users.noreply.github.com'
          git add app-v511.js styles-v511.css bootstrap-v511.js index.html RUNTIME-MANIFEST.md
          git commit -m 'Refine familiar mini sheets'
          git push
