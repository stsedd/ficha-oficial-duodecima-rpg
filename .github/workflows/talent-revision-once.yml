name: Apply talent revision once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/talent-revision-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch talent mechanics
        run: python3 scripts/apply-talent-revision.py

      - name: Check syntax
        run: node --check app-v511.js

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/talent-revision-once.yml scripts/apply-talent-revision.py
          git add app-v511.js
          git commit -m 'feat: atualiza mecânicas dos talentos na ficha'
          git push
