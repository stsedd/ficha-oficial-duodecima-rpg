name: Prévia perfil narrativo v5.41
on:
  push:
    branches: [preview-character-profile-v541]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check app-v511.js && node --check scripts/profile-v541-smoke.mjs
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Serve
        run: |
          python3 -m http.server 4173 > /tmp/ficha-profile.log 2>&1 &
          sleep 2
      - run: node scripts/profile-v541-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-v541-screenshots
          path: ui-artifacts/profile-v541
          if-no-files-found: ignore
