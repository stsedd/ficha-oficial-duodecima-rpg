name: Patch Banner Fit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-banner-fit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python scripts/tmp-fix-banner-fit.py

      - name: Syntax and banner regression checks
        run: |
          node --check scripts/ui-smoke.mjs
          grep -q 'v5.15.8-banner-fit' VERSION.txt
          grep -q 'max-height:none!important' styles-v511.css
          grep -q 'object-fit:contain!important' styles-v511.css
          ! grep -q 'max-height:260px!important' styles-v511.css

      - name: Commit fix
        run: |
          git config user.name 'duodecima-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add VERSION.txt styles-v511.css scripts/ui-smoke.mjs RUNTIME-MANIFEST.md
          git commit -m 'Fix banner sizing without crop'
          git push
