name: Base de testes · Ficha original
on:
  push:
    branches: [preview-ficha-original-base]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar-base:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar sintaxe
        run: |
          node --check ficha-teste-dados-ficticios.js
          node --check multi-character-preview-original.js
          node --check scripts/ficha-original-base-smoke.mjs
          node --check combat-powers-organizer-preview.js
          node --check combat-layout-cleanup-v2.js
          node --check scripts/combat-cleanup-v2-smoke.mjs
          node --check scripts/combat-topline-v3-smoke.mjs
          node --check scripts/combat-ux-polish-v4-smoke.mjs
          node --check overview-social-preview-v1.js
          node --check scripts/overview-social-preview-v1-smoke.mjs
          node --check scripts/combat-organizer-preview-smoke.mjs
      - name: Preparar Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Iniciar servidor local
        run: |
          python3 -m http.server 4173 > /tmp/original-preview.log 2>&1 &
          sleep 2
      - name: Testar base isolada
        run: node scripts/ficha-original-base-smoke.mjs
      - name: Testar perfil social e Visão Geral
        run: node scripts/overview-social-preview-v1-smoke.mjs
      - name: Testar usabilidade e organização v4
        run: node scripts/combat-ux-polish-v4-smoke.mjs
      - name: Testar nova faixa compacta de Combate
        run: node scripts/combat-topline-v3-smoke.mjs
      - name: Testar limpeza de Combate e minimização de poderes
        run: node scripts/combat-cleanup-v2-smoke.mjs
      - name: Testar reorganização de Combate e Poderes
        run: node scripts/combat-organizer-preview-smoke.mjs
      - name: Auditar organização das oito abas
        run: node scripts/ux-organization-audit.mjs
      - name: Salvar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ficha-original-base
          path: ui-artifacts/
          if-no-files-found: ignore
