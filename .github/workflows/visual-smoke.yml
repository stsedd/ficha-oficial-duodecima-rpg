name: Visual smoke · Ficha

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app-v511.js'
      - 'styles-v511.css'
      - 'bootstrap-v511.js'
      - 'contract-guard-v516.js'
      - 'lineage-creation-v515.js'
      - 'stabilization-v516.js'
      - 'magic-sacrifice-sync-v5153.js'
      - 'polish-v5152.css'
      - '.github/workflows/visual-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/duodecima-http.log 2>&1 &
          sleep 2
      - name: Capture desktop and mobile states
        run: |
          mkdir -p visual-artifacts
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const errors=[];
          const capture=async(viewport,label,mobile=false)=>{
            const context=await browser.newContext({viewport,isMobile:mobile});
            const page=await context.newPage();
            page.on('pageerror',e=>errors.push(`${label}: ${e.message}`));
            await page.addInitScript(()=>{
              const key='duodecima_universal_stage4_v24';
              const photo=(name,tone)=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#09090a"/><stop offset="1" stop-color="${tone}"/></linearGradient></defs><rect width="900" height="650" fill="url(#g)"/><circle cx="450" cy="270" r="150" fill="none" stroke="#ffffff33" stroke-width="10"/><path d="M210 420 Q450 120 690 420" fill="none" stroke="#ffffff88" stroke-width="18"/><text x="450" y="560" fill="#fff" font-family="serif" font-size="54" text-anchor="middle">${name}</text></svg>`);
              const seed={
                isCreated:true,name:'Visual QA',player:'CI',level:50,godId:'iuppiter',activeTab:'status',
                lineage:{type:'normal',namingVersion:2,secondaryGodId:'',structureGodId:'iuppiter'},
                familiars:{mountFameClaimed:false,notes:'QA visual da nova mini-ficha.',entries:[{
                  id:'fam-ci',name:'Névoa Rubra',species:'Alicórnio',type:'montaria',active:true,currentHp:52,
                  attributes:{for:2,des:1,con:2,int:0,fe:0,car:0},skills:['Atletismo','Percepção'],
                  images:[photo('Perfil','#5b1d2c'),photo('Voo','#2d263d'),photo('Detalhe','#4b3030')],
                  abilities:[
                    {id:'famab-1',name:'Vínculo Sagrado',type:'passiva',description:'Recebe bônus em testes de resistência enquanto permanece próximo do mestre.'},
                    {id:'famab-2',name:'Passos Etéreos',type:'passiva',description:'Move-se por terreno difícil sem penalidade.'},
                    {id:'famab-3',name:'Investida Alada',type:'ativa',description:'Avança em voo e derruba o alvo ao final do movimento.'}
                  ],
                  barding:{enabled:true,name:'Barda de Prata Lunar',type:'Leve',defense:16,material:'Prata e couro',effects:'Proteção reforçada para combate montado.',equipment:'Sela de campanha · alforjes',imageUrl:photo('Barda','#3c2528')},
                  knownVip:true,staffApproved:true,legendaryHpMax:0,legendaryUsed:false,legendaryOccasion:'',notes:'Temperamento protetor e muito atento ao dono.'
                }]}
              };
              localStorage.setItem(key,JSON.stringify(seed));
            });
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            await page.screenshot({path:`visual-artifacts/${label}-overview.png`,fullPage:true});
            const tabs=[
              {id:'combat',file:'combate'},
              {id:'inventory',file:'inventario'},
              {id:'familiars',file:'familiares'},
              {id:'magic',file:'magia'}
            ];
            for(const tab of tabs){
              const button=page.locator(`[data-tab="${tab.id}"]`).first();
              if(!(await button.count())){errors.push(`${label}: aba ${tab.id} não encontrada`);continue}
              await button.click();
              await page.waitForTimeout(220);
              if(tab.id==='familiars'){
                const familiar=await page.evaluate(()=>{
                  const card=document.querySelector('.familiar-sheet'),gallery=document.querySelectorAll('.familiar-photo-slot'),attrs=document.querySelectorAll('.familiar-attribute-row'),groups=document.querySelectorAll('.familiar-ability-group'),barding=document.querySelector('.familiar-barding');
                  return {card:!!card,gallery:gallery.length,attrs:attrs.length,groups:groups.length,barding:!!barding,scroll:document.documentElement.scrollWidth,viewport:window.innerWidth};
                });
                if(!familiar.card)errors.push(`${label}: mini-ficha de familiar ausente`);
                if(familiar.gallery!==3)errors.push(`${label}: galeria esperava 3 slots, encontrou ${familiar.gallery}`);
                if(familiar.attrs!==6)errors.push(`${label}: atributos esperavam 6 linhas, encontrou ${familiar.attrs}`);
                if(familiar.groups!==2)errors.push(`${label}: habilidades esperavam 2 grupos, encontrou ${familiar.groups}`);
                if(!familiar.barding)errors.push(`${label}: seção de barda ausente`);
                if(familiar.scroll>familiar.viewport+2)errors.push(`${label}: familiares com overflow horizontal ${familiar.scroll}px > ${familiar.viewport}px`);
              }
              await page.screenshot({path:`visual-artifacts/${label}-${tab.file}.png`,fullPage:true});
            }
            await context.close();
          };
          await capture({width:1440,height:1100},'desktop');
          await capture({width:390,height:844},'mobile',true);
          await browser.close();
          if(errors.length){console.error(errors.join('\n'));process.exit(1)}
          NODE
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ficha-visual-smoke
          path: visual-artifacts
          if-no-files-found: error
