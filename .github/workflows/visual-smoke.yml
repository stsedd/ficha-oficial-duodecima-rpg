name: Visual smoke · Ficha

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app-v511.js'
      - 'styles-v511.css'
      - 'bootstrap-v511.js'
      - 'contract-guard-v516.js'
      - 'lineage-creation-v515.js'
      - 'stabilization-v516.js'
      - 'rebento-fresh-creation-v5161.js'
      - 'rebento-mechanics-v516.js'
      - 'rebento-mechanics-v516.css'
      - 'rebento-visual-v5163.js'
      - 'rebento-visual-v5163.css'
      - 'rules-sync-v516.js'
      - 'rules-sync-v516.css'
      - 'polish-v5152.css'
      - 'critical-usability-v519.css'
      - 'visual-polish-v5191.css'
      - '.github/workflows/visual-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/duodecima-http.log 2>&1 &
          sleep 2
      - name: Capture desktop and mobile states
        run: |
          mkdir -p visual-artifacts
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const errors=[];
          const capture=async(viewport,label,mobile=false)=>{
            const context=await browser.newContext({viewport,isMobile:mobile});
            const page=await context.newPage();
            page.on('pageerror',e=>errors.push(`${label}: ${e.message}`));
            await page.addInitScript(()=>{
              const key='duodecima_universal_stage4_v24';
              const photo=(name,tone)=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#09090a"/><stop offset="1" stop-color="${tone}"/></linearGradient></defs><rect width="900" height="650" fill="url(#g)"/><circle cx="450" cy="270" r="150" fill="none" stroke="#ffffff33" stroke-width="10"/><path d="M210 420 Q450 120 690 420" fill="none" stroke="#ffffff88" stroke-width="18"/><text x="450" y="560" fill="#fff" font-family="serif" font-size="54" text-anchor="middle">${name}</text></svg>`);
              const seed={
                isCreated:true,name:'Visual QA',player:'CI',level:50,godId:'iuppiter',activeTab:'status',
                lineage:{type:'normal',namingVersion:2,secondaryGodId:'',structureGodId:'iuppiter'},
                armor:{equipped:true,name:'Lorica QA',type:'leve',material:'ferro-aco',resistanceCurrent:3,imageUrl:photo('Lorica','#39252b'),isHeritage:false,notes:'Armadura de teste usada para validar o baralho de combate.'},
                shield:{equipped:true,name:'Scutum QA',material:'ferro-aco',stakes:14,resistanceCurrent:3,masterTalent:false,imageUrl:photo('Scutum','#2f2227'),isHeritage:false,notes:'Escudo de teste visual.'},
                weapons:[{id:'weapon-ci',name:'Gladius QA',type:'corpo-a-corpo',attr:'for',material:'ferro-aco',stakes:8,resistanceCurrent:3,attackExtra:0,damageExtra:0,equipped:true,imageUrl:photo('Gladius','#5b1d2c'),isHeritage:false,notes:'Lâmina curta de campanha.'}],
                inventory:{aureus:3,denarius:42,notes:'QA visual do inventário.',items:[{id:'item-ci',name:'Poção de Cura QA',qty:3,category:'consumivel',material:'Vidro',rune:'',effect:'Recupera HP durante a cena.',notes:'Consumível usado para validar o card do baralho.',imageUrl:photo('Poção','#40243d'),showInDeck:true,isHeritage:false,attackAttr:'for',attackBonus:0,damage:'',range:''}]},
                familiars:{mountFameClaimed:false,notes:'QA visual da nova mini-ficha.',entries:[{
                  id:'fam-ci',name:'Névoa Rubra',species:'Alicórnio',type:'montaria',active:true,currentHp:52,
                  attributes:{for:2,des:1,con:2,int:0,fe:0,car:0},skills:['Atletismo','Percepção'],
                  images:[photo('Perfil','#5b1d2c'),photo('Voo','#2d263d'),photo('Detalhe','#4b3030')],
                  abilities:[
                    {id:'famab-1',name:'Vínculo Sagrado',type:'passiva',description:'Recebe bônus em testes de resistência enquanto permanece próximo do mestre.'},
                    {id:'famab-2',name:'Passos Etéreos',type:'passiva',description:'Move-se por terreno difícil sem penalidade.'},
                    {id:'famab-3',name:'Investida Alada',type:'ativa',description:'Avança em voo e derruba o alvo ao final do movimento.'}
                  ],
                  barding:{enabled:true,name:'Barda de Prata Lunar',type:'Leve',defense:16,material:'Prata e couro',effects:'Proteção reforçada para combate montado.',equipment:'Sela de campanha · alforjes',imageUrl:photo('Barda','#3c2528')},
                  knownVip:true,staffApproved:true,legendaryHpMax:0,legendaryUsed:false,legendaryOccasion:'',notes:'Temperamento protetor e muito atento ao dono.'
                }]}
              };
              localStorage.setItem(key,JSON.stringify(seed));
            });
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            try{await page.waitForSelector('[data-tab="combat"]',{state:'attached',timeout:5000})}
            catch(_){errors.push(`${label}: aba combat não encontrada após aguardar renderização`)}
            if(mobile){
              const critical=await page.evaluate(()=>{
                const brand=document.querySelector('.archive-brandbar');
                const title=document.querySelector('.archive-brand-copy>strong');
                const rail=document.querySelector('.character-rail');
                const tabs=document.querySelector('.sheet-tabs');
                const toggle=document.querySelector('#railMobileProfileToggle');
                const palette=document.querySelector('#themePaletteBtn');
                const firstTab=document.querySelector('.sheet-tabs [data-tab]');
                const rect=el=>el?.getBoundingClientRect();
                const titleRect=rect(title),brandRect=rect(brand);
                const minText=[...document.querySelectorAll('.rail-mobile-summary-copy small,.rail-mobile-summary-vitals span,.skill-tiny-check span')].reduce((min,el)=>Math.min(min,parseFloat(getComputedStyle(el).fontSize)||99),99);
                return {
                  collapsed:rail?.dataset.mobileExpanded,
                  railHeight:rect(rail)?.height||Infinity,
                  tabsTop:rect(tabs)?.top||Infinity,
                  viewport:innerHeight,
                  titleVisible:!!titleRect&&!!brandRect&&titleRect.left>=brandRect.left-1&&titleRect.right<=brandRect.right+1&&titleRect.width>80,
                  toggleHeight:rect(toggle)?.height||0,
                  paletteHeight:rect(palette)?.height||0,
                  tabHeight:rect(firstTab)?.height||0,
                  minText,
                  bannerHidden:getComputedStyle(document.querySelector('#siteBanner')).display==='none',
                  rightArrow:document.querySelector('.sheet-tabs')?.classList.contains('can-scroll-right')===true
                };
              });
              if(critical.collapsed!=='false')errors.push(`${label}: perfil mobile não iniciou recolhido`);
              if(critical.railHeight>280)errors.push(`${label}: resumo mobile alto demais (${critical.railHeight.toFixed(1)}px)`);
              if(critical.tabsTop>=critical.viewport)errors.push(`${label}: abas continuam fora da primeira tela (${critical.tabsTop.toFixed(1)}px >= ${critical.viewport}px)`);
              if(!critical.titleVisible)errors.push(`${label}: Character Archive continua cortado no header`);
              if(critical.toggleHeight<40||critical.paletteHeight<40||critical.tabHeight<40)errors.push(`${label}: alvo de toque abaixo de 40px (${critical.toggleHeight.toFixed(1)}/${critical.paletteHeight.toFixed(1)}/${critical.tabHeight.toFixed(1)})`);
              if(critical.minText<9.9)errors.push(`${label}: microtexto crítico abaixo de 10px (${critical.minText}px)`);
              if(!critical.bannerHidden)errors.push(`${label}: banner vazio continua reservando espaço`);
              if(!critical.rightArrow)errors.push(`${label}: navegação inicial não indica abas à direita`);
            }
            await page.screenshot({path:`visual-artifacts/${label}-overview.png`,fullPage:true});
            const tabs=[
              {id:'combat',file:'combate'},
              {id:'inventory',file:'inventario'},
              {id:'familiars',file:'familiares'},
              {id:'magic',file:'magia'}
            ];
            for(const tab of tabs){
              const button=page.locator(`[data-tab="${tab.id}"]`).first();
              if(!(await button.count())){errors.push(`${label}: aba ${tab.id} não encontrada`);continue}
              await button.click();
              await page.waitForTimeout(260);
              if(mobile){
                const navState=await page.evaluate((id)=>{
                  const scroller=document.querySelector('.sheet-tab-scroll'),active=document.querySelector(`[data-tab="${id}"]`),nav=document.querySelector('.sheet-tabs');
                  if(!scroller||!active||!nav)return {ok:false};
                  const s=scroller.getBoundingClientRect(),a=active.getBoundingClientRect();
                  return {
                    ok:true,
                    visible:a.left>=s.left-2&&a.right<=s.right+2,
                    active:active.classList.contains('active'),
                    canLeft:nav.classList.contains('can-scroll-left'),
                    canRight:nav.classList.contains('can-scroll-right')
                  };
                },tab.id);
                if(!navState.ok||!navState.active||!navState.visible)errors.push(`${label}: aba ativa ${tab.id} não ficou visível no carrossel`);
                if(['inventory','familiars','magic'].includes(tab.id)&&!navState.canLeft)errors.push(`${label}: navegação ${tab.id} deveria indicar abas anteriores`);
              }
              if(tab.id==='combat'&&mobile){
                const deck=await page.evaluate(()=>{
                  const el=document.querySelector('.equipment-deck.upgraded-equipment-deck'),cards=[...document.querySelectorAll('.equipment-deck.upgraded-equipment-deck .equipment-card')];
                  if(!el)return {present:false};
                  const style=getComputedStyle(el),first=cards[0]?.getBoundingClientRect();
                  return {present:true,count:cards.length,overflow:el.scrollWidth>el.clientWidth+4,flow:style.gridAutoFlow,firstWidth:first?.width||0,viewport:innerWidth};
                });
                if(!deck.present||deck.count<4)errors.push(`${label}: baralho de QA não renderizou 4 cartas`);
                if(!deck.overflow||deck.flow!=='column')errors.push(`${label}: baralho mobile não virou carrossel horizontal`);
                if(deck.firstWidth<250||deck.firstWidth>=deck.viewport)errors.push(`${label}: largura inesperada da carta mobile (${deck.firstWidth.toFixed(1)}px)`);
              }
              if(tab.id==='familiars'){
                const familiar=await page.evaluate(()=>{
                  const card=document.querySelector('.familiar-sheet'),gallery=document.querySelectorAll('.familiar-photo-slot'),attrs=document.querySelectorAll('.familiar-attribute-row'),groups=document.querySelectorAll('.familiar-ability-group'),barding=document.querySelector('.familiar-barding');
                  return {card:!!card,gallery:gallery.length,attrs:attrs.length,groups:groups.length,barding:!!barding,scroll:document.documentElement.scrollWidth,viewport:window.innerWidth};
                });
                if(!familiar.card)errors.push(`${label}: mini-ficha de familiar ausente`);
                if(familiar.gallery!==3)errors.push(`${label}: galeria esperava 3 slots, encontrou ${familiar.gallery}`);
                if(familiar.attrs!==6)errors.push(`${label}: atributos esperavam 6 linhas, encontrou ${familiar.attrs}`);
                if(familiar.groups!==2)errors.push(`${label}: habilidades esperavam 2 grupos, encontrou ${familiar.groups}`);
                if(!familiar.barding)errors.push(`${label}: seção de barda ausente`);
                if(familiar.scroll>familiar.viewport+2)errors.push(`${label}: familiares com overflow horizontal ${familiar.scroll}px > ${familiar.viewport}px`);
              }
              await page.screenshot({path:`visual-artifacts/${label}-${tab.file}.png`,fullPage:true});
            }
            await context.close();
          };
          await capture({width:1440,height:1100},'desktop');
          await capture({width:390,height:844},'mobile',true);

          // Regressão específica: Presságio Guardado precisa oferecer 1/2/3 slots
          // conforme as estacas e persistir o resultado anotado.
          {
            const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true});
            const page=await context.newPage();
            page.on('pageerror',e=>errors.push(`pressagio: ${e.message}`));
            await page.addInitScript(()=>{
              localStorage.setItem('duodecima_universal_stage4_v24',JSON.stringify({
                isCreated:true,name:'Presságio QA',player:'CI',level:50,godId:'fortuna',activeTab:'combat',
                lineage:{type:'normal',namingVersion:2,secondaryGodId:'',structureGodId:'fortuna'}
              }));
            });
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            const card=page.locator('.ability-card').filter({hasText:'Presságio Guardado'}).first();
            try{
              await card.waitFor({state:'visible',timeout:10000});
              let tracker=card.locator('.omen-tracker');
              if(await tracker.count()!==1)errors.push('pressagio: rastreador de d20 ausente');
              let slots=tracker.locator('[data-omen-slot]');
              if(await slots.count()!==1)errors.push(`pressagio: faixa 0–15 esperava 1 slot, encontrou ${await slots.count()}`);
              if(await slots.count()){
                await slots.first().fill('17');
                await slots.first().blur();
                await page.waitForTimeout(120);
              }
              const tier16=card.locator('[data-stake-set]').filter({hasText:'16'}).first();
              await tier16.click();await page.waitForTimeout(120);
              tracker=page.locator('.ability-card').filter({hasText:'Presságio Guardado'}).first().locator('.omen-tracker');
              slots=tracker.locator('[data-omen-slot]');
              if(await slots.count()!==2)errors.push(`pressagio: faixa 16–29 esperava 2 slots, encontrou ${await slots.count()}`);
              if(await slots.first().inputValue()!=='17')errors.push('pressagio: valor guardado não persistiu ao trocar de faixa');
              const tier30=page.locator('.ability-card').filter({hasText:'Presságio Guardado'}).first().locator('[data-stake-set]').filter({hasText:'30'}).first();
              await tier30.click();await page.waitForTimeout(120);
              tracker=page.locator('.ability-card').filter({hasText:'Presságio Guardado'}).first().locator('.omen-tracker');
              slots=tracker.locator('[data-omen-slot]');
              if(await slots.count()!==3)errors.push(`pressagio: faixa 30+ esperava 3 slots, encontrou ${await slots.count()}`);
              await tracker.locator('[data-omen-use]').first().click();await page.waitForTimeout(120);
              tracker=page.locator('.ability-card').filter({hasText:'Presságio Guardado'}).first().locator('.omen-tracker');
              if(await tracker.locator('[data-omen-slot]').first().inputValue()!=='')errors.push('pressagio: botão Usar não limpou o slot consumido');
            }catch(e){errors.push(`pressagio: ${e.message}`)}
            await context.close();
          }

          // Regressões específicas: habilidades que guardam estado/informação.
          const openAbilityQa=async(godId,name)=>{
            const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true});
            const page=await context.newPage();
            page.on('pageerror',e=>errors.push(`${godId}: ${e.message}`));
            await page.addInitScript(({godId,name})=>{
              localStorage.setItem('duodecima_universal_stage4_v24',JSON.stringify({
                isCreated:true,name,player:'CI',level:50,godId,activeTab:'combat',
                lineage:{type:'normal',namingVersion:2,secondaryGodId:'',structureGodId:godId}
              }));
            },{godId,name});
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            return {context,page};
          };

          {
            const {context,page}=await openAbilityQa('angerona','Segredos QA');
            try{
              let card=page.locator('.ability-card').filter({hasText:'Segredo Guardado'}).first();
              await card.waitFor({state:'visible',timeout:10000});
              await card.locator('[data-stake-set]').filter({hasText:'30'}).first().click();await page.waitForTimeout(120);
              card=page.locator('.ability-card').filter({hasText:'Segredo Guardado'}).first();
              const tracker=card.locator('[data-ability-tool="secrets"]'),fields=tracker.locator('[data-ability-tool-field]');
              if(await fields.count()!==3)errors.push(`segredo: 30+ esperava 3 campos, encontrou ${await fields.count()}`);
              await fields.first().fill('Nome verdadeiro do alvo');
              if((await fields.first().inputValue())!=='Nome verdadeiro do alvo')errors.push('segredo: campo não aceitou anotação');
              await tracker.locator('[data-ability-tool-clear]').first().click();await page.waitForTimeout(100);
              card=page.locator('.ability-card').filter({hasText:'Segredo Guardado'}).first();
              if(await card.locator('[data-ability-tool-field]').first().inputValue()!=='')errors.push('segredo: Esquecer não limpou o registro');
            }catch(e){errors.push(`segredo: ${e.message}`)}
            await context.close();
          }

          {
            const {context,page}=await openAbilityQa('angitia','Ampola QA');
            try{
              let card=page.locator('.ability-card').filter({hasText:'Transfusão Tóxica'}).first();
              await card.waitFor({state:'visible',timeout:10000});
              let tracker=card.locator('[data-ability-tool="toxic-vial"]'),field=tracker.locator('[data-ability-tool-field]');
              if(await tracker.count()!==1)errors.push('transfusao: rastreador de ampola ausente');
              await field.fill('Envenenado');
              await tracker.locator('[data-ability-tool-clear]').click();await page.waitForTimeout(100);
              card=page.locator('.ability-card').filter({hasText:'Transfusão Tóxica'}).first();
              if(await card.locator('[data-ability-tool-field]').inputValue()!=='')errors.push('transfusao: Aplicar/esvaziar não limpou a ampola');
            }catch(e){errors.push(`transfusao: ${e.message}`)}
            await context.close();
          }

          {
            const {context,page}=await openAbilityQa('libitina','Relicários QA');
            try{
              let card=page.locator('.ability-card').filter({hasText:'Relicários Funerários'}).first();
              await card.waitFor({state:'visible',timeout:10000});
              let tracker=card.locator('[data-ability-tool="funerary-relics"]');
              await tracker.locator('[data-ability-tool-set]').click();await page.waitForTimeout(100);
              card=page.locator('.ability-card').filter({hasText:'Relicários Funerários'}).first();tracker=card.locator('[data-ability-tool="funerary-relics"]');
              if((await tracker.locator('.relic-counter>strong').textContent()).trim()!=='1')errors.push('relicarios: Repor não preencheu o relicário');
              await tracker.locator('button.primary').click();await page.waitForTimeout(100);
              card=page.locator('.ability-card').filter({hasText:'Relicários Funerários'}).first();tracker=card.locator('[data-ability-tool="funerary-relics"]');
              if((await tracker.locator('.relic-counter>strong').textContent()).trim()!=='0')errors.push('relicarios: Consumir não reduziu o contador');
              await card.locator('[data-stake-set]').filter({hasText:'30'}).first().click();await page.waitForTimeout(100);
              card=page.locator('.ability-card').filter({hasText:'Relicários Funerários'}).first();tracker=card.locator('[data-ability-tool="funerary-relics"]');
              await tracker.locator('[data-ability-tool-set]').click();await page.waitForTimeout(100);
              card=page.locator('.ability-card').filter({hasText:'Relicários Funerários'}).first();tracker=card.locator('[data-ability-tool="funerary-relics"]');
              if((await tracker.locator('.relic-counter>strong').textContent()).trim()!=='3')errors.push('relicarios: faixa 30+ não repôs 3 relicários');
            }catch(e){errors.push(`relicarios: ${e.message}`)}
            await context.close();
          }

          {
            const {context,page}=await openAbilityQa('invidia','Inveja QA');
            try{
              let card=page.locator('.ability-card').filter({hasText:'Objeto da Inveja'}).first();
              await card.waitFor({state:'visible',timeout:10000});
              let tracker=card.locator('[data-ability-tool="envy-target"]'),field=tracker.locator('[data-ability-tool-field]');
              if(await tracker.count()!==1)errors.push('invidia: controle de alvo ausente');
              await field.fill('Hydra QA');
              await tracker.locator('[data-ability-tool-toggle]').check();await page.waitForTimeout(100);
              card=page.locator('.ability-card').filter({hasText:'Objeto da Inveja'}).first();tracker=card.locator('[data-ability-tool="envy-target"]');
              if(await tracker.locator('[data-ability-tool-field]').inputValue()!=='Hydra QA')errors.push('invidia: alvo não persistiu após marcar a troca');
              if(!(await tracker.locator('[data-ability-tool-toggle]').isChecked()))errors.push('invidia: uso da troca não persistiu');
              await tracker.locator('[data-ability-tool-clear-many]').click();await page.waitForTimeout(100);
              card=page.locator('.ability-card').filter({hasText:'Objeto da Inveja'}).first();
              if(await card.locator('[data-ability-tool-field]').inputValue()!=='')errors.push('invidia: Nova cena não limpou o alvo');
            }catch(e){errors.push(`invidia: ${e.message}`)}
            await context.close();
          }

          {
            const {context,page}=await openAbilityQa('laverna','Eco QA');
            try{
              let card=page.locator('.ability-card').filter({hasText:'Eco de Travessia'}).first();
              await card.waitFor({state:'visible',timeout:10000});
              await card.locator('[data-stake-set]').filter({hasText:'30'}).first().click();await page.waitForTimeout(100);
              card=page.locator('.ability-card').filter({hasText:'Eco de Travessia'}).first();
              let tracker=card.locator('[data-ability-tool="travel-echo"]'),field=tracker.locator('[data-ability-tool-field]');
              await field.fill('Atrás do altar');
              const toggles=tracker.locator('[data-ability-tool-toggle]');
              if(await toggles.count()!==2)errors.push(`eco: 30+ esperava 2 controles de uso, encontrou ${await toggles.count()}`);
              await toggles.first().check();await page.waitForTimeout(100);
              card=page.locator('.ability-card').filter({hasText:'Eco de Travessia'}).first();tracker=card.locator('[data-ability-tool="travel-echo"]');
              if(await tracker.locator('[data-ability-tool-field]').inputValue()!=='Atrás do altar')errors.push('eco: ponto marcado não persistiu');
              if(await tracker.locator('[data-ability-tool-toggle]').nth(1).isDisabled())errors.push('eco: rota adicional do aliado continuou bloqueada depois do retorno');
              await tracker.locator('[data-ability-tool-clear-many]').click();await page.waitForTimeout(100);
              card=page.locator('.ability-card').filter({hasText:'Eco de Travessia'}).first();
              if(await card.locator('[data-ability-tool-field]').inputValue()!=='')errors.push('eco: Limpar eco não removeu o ponto');
            }catch(e){errors.push(`eco: ${e.message}`)}
            await context.close();
          }

          // Regressão: trocas de ativas por Legado assumem nível/custo da vaga substituída.
          {
            const context=await browser.newContext({viewport:{width:1280,height:900}});
            const page=await context.newPage();
            page.on('pageerror',e=>errors.push(`legacy-swap: ${e.message}`));
            await page.addInitScript(()=>{
              localStorage.setItem('duodecima_universal_stage4_v24',JSON.stringify({
                isCreated:true,name:'Legado QA',player:'CI',level:50,godId:'fortuna',activeTab:'combat',
                lineage:{
                  type:'direct',namingVersion:2,secondaryGodId:'angitia',structureGodId:'fortuna',
                  compoundPassiveReplacements:[],
                  compoundActiveReplacements:[
                    {primaryIndex:4,secondaryId:'infusao-vital'},
                    {primaryIndex:3,secondaryId:'formulacao-rapida'}
                  ],
                  compoundActiveSlots:[],directPrimaryPassives:[],directSecondaryPassives:[]
                }
              }));
            });
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            try{
              const assertSwap=async(name,expectedLevel,expectedCost)=>{
                const card=page.locator('.ability-card').filter({hasText:name}).first();
                await card.waitFor({state:'visible',timeout:10000});
                const text=(await card.textContent())||'';
                if(!text.includes(`Nv ${expectedLevel}`))errors.push(`legacy-swap: ${name} não assumiu Nv ${expectedLevel}`);
                if(!text.includes(`${expectedCost} EN`))errors.push(`legacy-swap: ${name} não assumiu custo ${expectedCost} EN`);
                const use=(await card.locator('[data-use-ability]').textContent())||'';
                if(!use.includes(`−${expectedCost} EN`))errors.push(`legacy-swap: botão de ${name} ainda cobra custo original`);
              };
              await assertSwap('Infusão Vital',20,70);
              await assertSwap('Formulação Rápida',15,45);
            }catch(e){errors.push(`legacy-swap: ${e.message}`)}
            await context.close();
          }

          // Regressão: Mortal da Névoa não herda deus, poderes ou Energia natural.
          {
            const context=await browser.newContext({viewport:{width:1280,height:900}});
            const page=await context.newPage();
            page.on('pageerror',e=>errors.push(`mortal: ${e.message}`));
            await page.addInitScript(()=>{
              localStorage.setItem('duodecima_universal_stage4_v24',JSON.stringify({
                isCreated:true,name:'Mortal QA',player:'CI',level:20,originType:'mortal',originSkillChoice:'Medicina',
                godId:'iuppiter',activeTab:'status',
                baseAttributes:{for:2,des:1,con:2,int:1,fe:1,car:1},
                initialSkills:['Percepção','Investigação','Sobrevivência'],
                lineage:{type:'normal',namingVersion:2,secondaryGodId:'',structureGodId:'',compoundPassiveReplacements:[],compoundActiveReplacements:[],compoundActiveSlots:[],directPrimaryPassives:[],directSecondaryPassives:[]}
              }));
            });
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            try{
              await page.locator('.mortal-origin-section').waitFor({state:'visible',timeout:10000});
              await page.locator('.qol-rest-strip').waitFor({state:'visible',timeout:10000});
              const body=(await page.textContent('body'))||'';
              const restCopy=(await page.locator('.qol-rest-copy small').textContent())||'';
              if(restCopy.includes('EN'))errors.push(`mortal: resumo de descanso ainda promete Energia inexistente (${restCopy})`);
              if(!body.includes('Mortal da Névoa'))errors.push('mortal: identidade Mortal da Névoa ausente');
              if(await page.locator('.ability-card').count()!==0)errors.push('mortal: habilidades divinas foram renderizadas');
              if(await page.locator('.mortal-origin-section').count()!==1)errors.push('mortal: card de origem mortal ausente');
              const hp=(await page.locator('.core-hp .core-stat-value').first().textContent()||'').replace(/\s+/g,'');
              if(hp!=='22/22')errors.push(`mortal: HP Nv20 esperado 22/22, recebeu ${hp}`);
              const en=(await page.locator('.core-en .core-stat-value').first().textContent()||'').trim();
              if(en!=='—')errors.push(`mortal: sem Magia deveria mostrar EN —, recebeu ${en}`);
              if(await page.locator('.core-en .core-stat-adjust').count())errors.push('mortal: Energia inexistente ainda oferece ajuste manual');
              const cast=(await page.locator('.core-cast .core-stat-value').first().textContent()||'').trim();
              if(cast!=='—')errors.push(`mortal: conjuração comum deveria ser —, recebeu ${cast}`);
              if(body.includes('0 EN · Inconsciente'))errors.push('mortal: ausência de Energia foi tratada como inconsciência');
              if(body.includes('divino +'))errors.push('mortal: bônus divino apareceu no detalhamento de atributos');
              await page.screenshot({path:'visual-artifacts/desktop-mortal.png',fullPage:true});
            }catch(e){errors.push(`mortal: ${e.message}`)}
            await context.close();
          }

          // Criação mortal: origem substitui a escolha de deus e concede uma perícia gratuita.
          {
            const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true});
            const page=await context.newPage();
            page.on('pageerror',e=>errors.push(`mortal-create: ${e.message}`));
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            try{
              await page.selectOption('#originType','mortal');
              await page.locator('#originSkillChoice').waitFor({state:'visible',timeout:10000});
              if(await page.locator('#godSelect').count())errors.push('mortal-create: seletor de deus permaneceu visível');
              if(await page.locator('#originSkillChoice').count()!==1)errors.push('mortal-create: seletor de perícia de origem ausente');
              await page.selectOption('#originSkillChoice','Medicina');await page.waitForTimeout(120);
              const medicine=page.locator('[data-skill="Medicina"]');
              if(!(await medicine.isDisabled()))errors.push('mortal-create: perícia de origem ainda pode ser gasta nas escolhas por INT');
              const text=(await page.textContent('.mortal-creation-box'))||'';
              if(!text.includes('10 + CON')||!text.includes('+3 + CON')||!text.includes('+15 EN'))errors.push('mortal-create: regras básicas não aparecem na criação');
              await page.screenshot({path:'visual-artifacts/mobile-mortal-creation.png',fullPage:true});
            }catch(e){errors.push(`mortal-create: ${e.message}`)}
            await context.close();
          }

          // Mortal mágico: +15 EN a cada 10 níveis, mais sacrifícios, sem penalizar a progressão mortal de HP.
          {
            const context=await browser.newContext({viewport:{width:1280,height:900}});
            const page=await context.newPage();
            page.on('pageerror',e=>errors.push(`mortal-magic: ${e.message}`));
            await page.addInitScript(()=>{
              localStorage.setItem('duodecima_universal_stage4_v24',JSON.stringify({
                isCreated:true,name:'Mortal Mago QA',player:'CI',level:20,originType:'mortal',originSkillChoice:'Medicina',
                godId:'iuppiter',activeTab:'magic',currentEnergy:55,
                baseAttributes:{for:2,des:1,con:2,int:1,fe:1,car:1},
                initialSkills:['Percepção','Investigação','Sobrevivência'],
                lineage:{type:'normal',namingVersion:2,secondaryGodId:'',structureGodId:'',compoundPassiveReplacements:[],compoundActiveReplacements:[],compoundActiveSlots:[],directPrimaryPassives:[],directSecondaryPassives:[]},
                magic:{enabled:true,castingAttr:'int',circle:1,sacrifices:{for:1,des:0,con:0},spells:[],concentrationSpellId:'',concentrationDamage:0,highCircleUsed:{6:0,7:0,8:0,9:0},notes:''}
              }));
            });
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            try{
              await page.locator('[data-pane="magic"] .magic-summary').waitFor({state:'visible',timeout:10000});
              const magicText=(await page.textContent('[data-pane="magic"]'))||'';
              if(!magicText.includes('Energia máx. 55'))errors.push('mortal-magic: Nv20 + 1 sacrifício deveria resultar em 55 EN');
              if(!magicText.includes('+15 EN'))errors.push('mortal-magic: progressão de +15 EN/10 níveis não está explicada');
              const hp=(await page.locator('.rail-vitals').first().textContent())||'';
              if(!hp.includes('22/22'))errors.push('mortal-magic: Magia reduziu indevidamente a progressão de HP mortal');
              const rail=(await page.locator('.rail-vitals').first().textContent())||'';
              if(!rail.replace(/\s+/g,' ').includes('55/55'))errors.push('mortal-magic: reserva de Energia 55/55 não apareceu na ficha');
            }catch(e){errors.push(`mortal-magic: ${e.message}`)}
            await context.close();
          }

          // Banners de habilidade + baralho rápido: 3 favoritas, resumo customizado e navegação para a habilidade.
          {
            const context=await browser.newContext({viewport:{width:1280,height:900}});
            const page=await context.newPage();
            page.on('pageerror',e=>errors.push(`ability-deck: ${e.message}`));
            await page.addInitScript(()=>{
              const art='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260"><defs><linearGradient id="g"><stop stop-color="#162f2a"/><stop offset="1" stop-color="#a77735"/></linearGradient></defs><rect width="900" height="260" fill="url(#g)"/><circle cx="680" cy="95" r="38" fill="#d52d2d"/><path d="M80 190 Q360 30 790 170" fill="none" stroke="#f5e2af" stroke-width="8"/></svg>');
              localStorage.setItem('duodecima_universal_stage4_v24',JSON.stringify({
                isCreated:true,name:'Baralho QA',player:'CI',level:50,godId:'fortuna',activeTab:'combat',
                lineage:{type:'normal',namingVersion:2,secondaryGodId:'',structureGodId:'fortuna'},
                abilityDeck:['fortuna:active:pressagio-guardado','fortuna:active:bencao-boa-hora','fortuna:active:mau-agouro'],
                abilityVisuals:{'fortuna:active:pressagio-guardado':{imageUrl:art,summary:'Guarda resultados de d20 para substituir rolagens.'}}
              }));
            });
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            try{
              await page.locator('.ability-quick-deck').waitFor({state:'visible',timeout:10000});
              if(await page.locator('.ability-quick-card').count()!==3)errors.push(`ability-deck: esperava 3 cartas rápidas, encontrou ${await page.locator('.ability-quick-card').count()}`);
              const pressagio=page.locator('.ability-card').filter({hasText:'Presságio Guardado'}).first();
              await pressagio.waitFor({state:'visible',timeout:10000});
              if(await pressagio.locator('.ability-art-banner img').count()!==1)errors.push('ability-deck: banner de Presságio Guardado ausente');
              const quick=page.locator('.ability-quick-card').filter({hasText:'Presságio Guardado'}).first();
              if(!((await quick.textContent())||'').includes('Guarda resultados de d20'))errors.push('ability-deck: resumo customizado não apareceu na carta');
              await quick.locator('[data-open-ability-button]').click();await page.waitForTimeout(180);
              if(!(await pressagio.evaluate(el=>el.classList.contains('ability-jump-highlight'))))errors.push('ability-deck: abrir carta não destacou a habilidade completa');
              const augurio=page.locator('.ability-card').filter({hasText:'Augúrio'}).first();
              await augurio.locator('[data-ability-deck-toggle]').click();await page.waitForTimeout(80);
              if(!((await page.locator('#toast').textContent())||'').includes('até 3 habilidades'))errors.push('ability-deck: limite de 3 favoritas não foi aplicado');
              const stored=await page.evaluate(()=>JSON.parse(localStorage.getItem('duodecima_universal_stage4_v24')||'{}').abilityDeck||[]);
              if(stored.length!==3)errors.push(`ability-deck: limite deveria persistir 3 favoritas, persistiu ${stored.length}`);
              await page.screenshot({path:'visual-artifacts/desktop-ability-deck.png',fullPage:true});
            }catch(e){errors.push(`ability-deck: ${e.message}`)}
            await context.close();
          }

          await browser.close();
          if(errors.length){console.error(errors.join('\n'));process.exit(1)}
          NODE
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ficha-visual-smoke
          path: visual-artifacts
          if-no-files-found: error
