name: Sync visible ficha version

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-index-version.mjs'
      - 'VERSION.txt'
      - '.github/workflows/sync-index-version.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch index version and cache keys
        run: node scripts/patch-index-version.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html; then
            echo 'index.html já está sincronizado.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'chore: sync ficha visible version'
          git push
