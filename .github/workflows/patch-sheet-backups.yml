name: Patch sheet backups

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-sheet-backups.yml'
      - '.github/patch-sheet-backups.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch backup system
        run: python3 .github/patch-sheet-backups.py
      - name: Validate patch
        run: |
          node --check app-v511.js
          node --check bootstrap-v511.js
          grep -q "SHEET_BACKUP_DB" app-v511.js
          grep -q "Antes de resetar / criar outra ficha" app-v511.js
          grep -q 'id="backupDialog"' index.html
          grep -q 'id="backupsBtn"' index.html
          grep -q 'v5.15.14-backups' VERSION.txt
          grep -q 'v5.15.14-backups' bootstrap-v511.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-v511.js index.html styles-v511.css bootstrap-v511.js VERSION.txt RUNTIME-MANIFEST.md
          git commit -m 'Add automatic sheet backups and restore'
          git push
