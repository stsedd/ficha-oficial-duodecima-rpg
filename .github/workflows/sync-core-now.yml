name: Sync Core now
on:
  push:
    paths:
      - '.github/workflows/sync-core-now.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync canonical Core snapshot
        run: node scripts/sync-core-snapshot.mjs
      - name: Validate Indefeso snapshot
        run: |
          node -e "const s=require('./core-snapshot.json'); const i=s.conditions.conditions.find(x=>x.id==='indefeso'); const p=s.conditions.conditions.find(x=>x.id==='paralisado'); if(!i||i.automation?.fixedDefense!==5) process.exit(1); if(!p||/Defesa é 5/.test(p.description)) process.exit(1); console.log(s.manifest.contentVersion, i.name, p.description)"
      - name: Commit snapshot
        run: |
          if git diff --quiet -- core-snapshot.json; then
            echo 'Snapshot já atualizado.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core-snapshot.json
          git commit -m 'chore: sync Core snapshot for Indefeso'
          git push
